name: GROOSE remote-only Windows build

# Builds an unsigned Windows NSIS installer from the GROOSE remote-only branch,
# which is desktop-v0.5.28 (f87c1089) plus two reviewed patches. Manual only:
# no push/pull_request/schedule trigger, no tag, no release, no updater
# artifact, no signing secrets. The installer is published only as a
# short-lived Actions artifact for isolated testing.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: groose-remote-only-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Windows installer (unsigned)
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      TARGET: x86_64-pc-windows-msvc
      BASE_COMMIT: f87c10895ea35a9a2cea629fef1d7532a3fecbc5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify base commit and patch scope
        shell: bash
        run: |
          set -euo pipefail
          if ! git cat-file -e "$BASE_COMMIT^{commit}"; then
            git fetch --no-tags origin "$BASE_COMMIT"
          fi
          git merge-base --is-ancestor "$BASE_COMMIT" HEAD
          echo "HEAD: $(git rev-parse HEAD)"
          CHANGED=$(git diff --name-only "$BASE_COMMIT"...HEAD | sort)
          printf '%s\n' "$CHANGED"
          EXPECTED=$(printf '%s\n' \
            ".github/workflows/groose-remote-only-windows.yml" \
            "desktop/src-tauri/src/managed_agents/runtime.rs" \
            "desktop/src/features/messages/ui/useDetachedAgentStart.ts" | sort)
          if [[ "$CHANGED" != "$EXPECTED" ]]; then
            echo "::error::Branch changes more than the two approved patches plus this workflow"
            exit 1
          fi

      - name: Verify patched file hashes
        shell: bash
        run: |
          set -euo pipefail
          echo "7a96c3c7d249dc635782e50b720cd7185091d693becd4be573e3239c08cd028d  desktop/src-tauri/src/managed_agents/runtime.rs" | sha256sum -c -
          echo "5216dab824e989398ee342b797c194f32fa6fec6794f9c03912783a24520117c  desktop/src/features/messages/ui/useDetachedAgentStart.ts" | sha256sum -c -

      - name: Add Rust target
        shell: bash
        run: rustup target add "$TARGET"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.14.1
          package-manager-cache: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.4.0

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm store cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install dependencies (lockfile frozen)
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Desktop typecheck
        shell: bash
        run: pnpm -C desktop typecheck

      - name: Desktop unit tests
        shell: bash
        run: pnpm -C desktop test

      - name: Build sidecars
        shell: bash
        run: |
          cargo build --locked --release --target "$TARGET" -p buzz-acp -p buzz-agent -p buzz-dev-mcp -p git-credential-nostr -p buzz-cli
          ./scripts/bundle-sidecars.sh "$TARGET"

      # Full buzz-desktop suite, no test filter: the new guard tests run here
      # alongside every existing test, so a regression in another agent or in
      # the shared spawn path fails the build.
      - name: Desktop Rust test suite (full)
        shell: bash
        run: cargo test --locked --manifest-path desktop/src-tauri/Cargo.toml --target "$TARGET"
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"

      - name: Generate non-updating bundle config
        shell: bash
        run: |
          cat > desktop/src-tauri/tauri.unsigned.conf.json <<'JSON'
          {
            "bundle": {
              "createUpdaterArtifacts": false
            }
          }
          JSON

      - name: Build Windows NSIS installer (unsigned)
        shell: bash
        run: cd desktop && pnpm tauri build --target "$TARGET" --bundles nsis --config src-tauri/tauri.unsigned.conf.json -- --locked
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"

      - name: Locate installer and compute SHA-256
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE_DIR="desktop/src-tauri/target/${TARGET}/release/bundle/nsis"
          EXE=$(find "$BUNDLE_DIR" -name '*.exe' -type f | head -1)
          if [[ -z "$EXE" ]]; then
            echo "::error::No NSIS installer found in $BUNDLE_DIR"
            exit 1
          fi
          sha256sum "$EXE" | tee installer.sha256
          echo "exe=$EXE" >> "$GITHUB_OUTPUT"

      - name: Upload unsigned installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: buzz-groose-remote-only-${{ github.sha }}
          path: |
            ${{ steps.artifact.outputs.exe }}
            installer.sha256
          if-no-files-found: error
          retention-days: 7
